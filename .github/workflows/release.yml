name: Android Release

# 触发：推送 v* tag 或手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Android — APK (arm64-v8a)
  # ─────────────────────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate Localization
        run: flutter gen-l10n

      - name: Build APK (release, arm64-v8a)
        run: flutter build apk --release --target-platform android-arm64

      - name: Read App Version
        id: version
        run: |
          raw=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | tr -d '[:space:]')
          version=${raw%%+*}
          echo "app_version=$version" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Rename & Stage APK
        run: |
          mkdir -p dist
          apk=$(find build/app/outputs/flutter-apk -maxdepth 1 -name '*.apk' | head -1)
          echo "Built APK: $apk"
          cp "$apk" "dist/proxypin-mcp-android-${APP_VERSION}-arm64-v8a.apk"
          ls -lh dist/

      - name: Upload Android arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-arm64-v8a
          path: dist/proxypin-mcp-android-*-arm64-v8a.apk
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # Job 2: 发布 GitHub Release（仅 tag 触发时执行）
  # ─────────────────────────────────────────────────────────────
  publish-release:
    needs: [build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List Release Files
        run: ls -lh artifacts/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
