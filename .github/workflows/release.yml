name: Android Release

# 触发：推送 v* tag 或手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Android — APK (split-per-abi)
  # ─────────────────────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate Localization
        run: flutter gen-l10n

      - name: Build APK (release, universal)
        run: flutter build apk --release

      - name: Read App Version
        id: version
        run: |
          raw=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | tr -d '[:space:]')
          version=${raw%%+*}
          echo "app_version=$version" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Rename & Stage APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/proxypin-mcp-android-${APP_VERSION}.apk"
          ls -lh dist/

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/proxypin-mcp-android-*.apk
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # Job 2: 发布 GitHub Release（仅 tag 触发时执行）
  # ─────────────────────────────────────────────────────────────
  publish-release:
    needs: [build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List Release Files
        run: ls -lh artifacts/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
